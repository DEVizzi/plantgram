name: Automated Instagram Plant Post

on:
  schedule:
    # Twice daily at global peak engagement windows
    - cron: "30 13 * * *" # 1:30 PM UTC = 7:00 PM IST / 8:30 AM EST
    - cron: "0 0 * * *"   # 00:00 UTC = 5:30 AM IST / 7:00 PM EST

  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest -v test_plantgram.py

      - name: Run Automation Script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_USER_TOKEN: ${{ secrets.IG_USER_TOKEN }}
          FB_APP_ID: ${{ secrets.FB_APP_ID }}
          FB_APP_SECRET: ${{ secrets.FB_APP_SECRET }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
        run: python main.py

      - name: 💾 Commit updated history.txt
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add history.txt
          git diff --cached --quiet || (git commit -m "Update history.txt [skip ci]" && git push)
