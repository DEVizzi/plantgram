name: Automated Instagram Plant Post

on:
  schedule:
    # Six peak global engagement times (UTC)
   # - cron: "30 1 * * 1"  # 7:00 AM IST
# - cron: "30 7 * * 1"  # 1:00 PM IST
# - cron: "30 14 * * 1" # 8:00 PM IST

# Tuesday
# - cron: "30 2 * * 2"  # 8:00 AM IST
# - cron: "30 8 * * 2"  # 2:00 PM IST
# - cron: "30 15 * * 2" # 9:00 PM IST

# Wednesday
# - cron: "30 1 * * 3"  # 7:00 AM IST
# - cron: "30 7 * * 3"  # 1:00 PM IST
# - cron: "30 14 * * 3" # 8:00 PM IST

# Thursday
# - cron: "30 2 * * 4"  # 8:00 AM IST
# - cron: "30 8 * * 4"  # 2:00 PM IST
# - cron: "30 15 * * 4" # 9:00 PM IST

# Friday
# - cron: "30 1 * * 5"  # 7:00 AM IST
# - cron: "30 7 * * 5"  # 1:00 PM IST
# - cron: "30 14 * * 5" # 8:00 PM IST

# Saturday
# - cron: "30 3 * * 6"  # 9:00 AM IST
# - cron: "30 9 * * 6"  # 3:00 PM IST
# - cron: "30 16 * * 6" # 10:00 PM IST

# Sunday
# - cron: "30 2 * * 0"  # 8:00 AM IST
# - cron: "30 8 * * 0"  # 2:00 PM IST
# - cron: "30 15 * * 0" # 9:00 PM IST
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Google API Key (optional)
        if: ${{ env.GOOGLE_API_KEY != '' }}
        run: |
          echo "GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }}" >> $GITHUB_ENV
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Run Automation Script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

        run: python main.py

      - name: 💾 Commit updated history.txt
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add history.txt
          git commit -m "Update history.txt [skip ci]" || echo "No changes to commit"
          git push
