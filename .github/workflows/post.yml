name: Automated Instagram Plant Post

on:
  schedule:
    # Monday to Sunday — 10:00 AM IST and 7:30 PM IST
    #- cron: "30 4 * * 1"  # 10:00 AM IST Monday

  workflow_dispatch:


jobs:
  post:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Prepare Google API Key (optional)
        if: ${{ env.GOOGLE_API_KEY != '' }}
        run: |
          echo "GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }}" >> $GITHUB_ENV
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      - name: Run Automation Script
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}

        run: python main.py

      - name: 💾 Commit updated history.txt
        run: |
          git config --global user.name 'github-actions'
          git config --global user.email 'github-actions@github.com'
          git add history.txt
          git commit -m "Update history.txt [skip ci]" || echo "No changes to commit"
          git push
